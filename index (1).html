<title>ماذا تريد أن تتعلم؟ | cntic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#5d6670;--bd:#dde1e6;--c0:#2f67b1;--c1:#0f6e56;--c2:#534ab7;--c3:#993c1d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161a;--card:#1d2026;--tx:#eceef1;--mu:#9aa3ad;--bd:#2d323a;--c0:#6fa0e6;--c1:#3fbf97;--c2:#9a93f0;--c3:#ee8f6d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14161a;--card:#1d2026;--tx:#eceef1;--mu:#9aa3ad;--bd:#2d323a;--c0:#6fa0e6;--c1:#3fbf97;--c2:#9a93f0;--c3:#ee8f6d;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.7 "IBM Plex Sans Arabic",system-ui,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:32px 16px 40px}
header{text-align:center;margin-bottom:28px}
.lg{display:inline-block;background:#fff;border:1px solid var(--bd);border-radius:16px;padding:14px 18px;margin-bottom:20px}
.lg img{display:block;width:120px;height:auto}
h1{font-size:26px;font-weight:600;line-height:1.4;margin:0 0 8px}
.sub{margin:0 auto;max-width:420px;color:var(--mu);font-size:15px}
.list{display:grid;gap:12px}
.cd{display:flex;align-items:center;gap:14px;min-height:92px;padding:16px;background:var(--card);border:1px solid var(--bd);border-inline-start:4px solid var(--c);border-radius:12px;color:var(--tx);text-decoration:none;transition:border-color .2s,transform .2s}
.cd:hover{border-color:var(--c)}
.cd:active{transform:scale(.99)}
.cd:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.tg{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:15px;direction:ltr;background:color-mix(in srgb,var(--c) 14%,var(--card));color:var(--c)}
.tx{flex:1;min-width:0}
.tx b{display:block;font-weight:600;font-size:18px;line-height:1.4}
.tx small{display:block;color:var(--mu);font-size:14px;line-height:1.6}
.tx em{display:block;font-style:normal;color:var(--c);font-size:13px;font-weight:500;margin-top:2px}
.ar{flex:none;color:var(--c);font-size:20px}
.hint{text-align:center;color:var(--mu);font-size:14px;margin:20px 0 0}
footer{margin-top:40px;padding-top:20px;border-top:1px solid var(--bd);text-align:center;color:var(--mu);font-size:14px}
footer bdi{font-weight:600;color:var(--tx)}
@media (prefers-reduced-motion:reduce){.cd{transition:none}}
</style>

<script>
const FB=[{"id": "fe", "t": "Front End", "d": "بناء واجهات المواقع: HTML وCSS وJavaScript وReact", "tag": "FE", "c": "c0", "m": "7 مراحل · امتحان لكل مرحلة", "href": "frontend-roadmap.html"}, {"id": "be", "t": "Back End", "d": "الخوادم وقواعد البيانات وواجهات API مع Node.js", "tag": "BE", "c": "c1", "m": "7 مراحل · امتحان لكل مرحلة", "href": "backend-roadmap.html"}, {"id": "mb", "t": "تطوير الموبايل", "d": "تطبيقات أندرويد وiOS بـ React Native وExpo", "tag": "MB", "c": "c2", "m": "7 مراحل · امتحان لكل مرحلة", "href": "mobile-roadmap.html"}, {"id": "ai", "t": "الذكاء الاصطناعي", "d": "تعلّم الآلة والتعلّم العميق وتطبيقات LLM بـ Python", "tag": "AI", "c": "c3", "m": "7 مراحل · امتحان لكل مرحلة", "href": "ai-roadmap.html"}];
const OK=h=>/^https?:\/\//i.test(h)||/^[A-Za-z0-9_\-]+(?:\/[A-Za-z0-9_\-]+)*\.html?$/.test(h);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function draw(a){
const v=(Array.isArray(a)?a:[]).filter(x=>x&&x.t&&OK(String(x.href)));
document.getElementById("list").innerHTML=v.length?v.map(x=>{const ex=/^https?:/i.test(x.href);return '<a class="cd" style="--c:var(--'+(/^c[0-3]$/.test(x.c)?x.c:"c0")+')" href="'+esc(x.href)+'"'+(ex?' target="_blank" rel="noopener"':'')+'><span class="tg">'+esc(x.tag||"")+'</span><span class="tx"><b>'+esc(x.t)+'</b><small>'+esc(x.d||"")+'</small><em>'+esc(x.m||"")+'</em></span><span class="ar" aria-hidden="true">←</span></a>'}).join(""):'<p class="hint">لا توجد مسارات حاليًا.</p>';
document.getElementById("hint").hidden=!v.some(x=>x.id=="fe");
}
fetch("tracks.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(draw).catch(()=>draw(FB));
</script>
