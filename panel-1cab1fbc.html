<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>لوحة التحكم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#5d6670;--bd:#dde1e6;--c0:#2f67b1;--c1:#0f6e56;--c2:#534ab7;--c3:#993c1d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161a;--card:#1d2026;--tx:#eceef1;--mu:#9aa3ad;--bd:#2d323a;--c0:#6fa0e6;--c1:#3fbf97;--c2:#9a93f0;--c3:#ee8f6d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14161a;--card:#1d2026;--tx:#eceef1;--mu:#9aa3ad;--bd:#2d323a;--c0:#6fa0e6;--c1:#3fbf97;--c2:#9a93f0;--c3:#ee8f6d;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.7 "IBM Plex Sans Arabic",system-ui,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:32px 16px 40px}
header{text-align:center;margin-bottom:28px}
.lg{display:inline-block;background:#fff;border:1px solid var(--bd);border-radius:16px;padding:14px 18px;margin-bottom:20px}
.lg img{display:block;width:120px;height:auto}
h1{font-size:26px;font-weight:600;line-height:1.4;margin:0 0 8px}
.sub{margin:0 auto;max-width:420px;color:var(--mu);font-size:15px}
.list{display:grid;gap:12px}
.cd{display:flex;align-items:center;gap:14px;min-height:92px;padding:16px;background:var(--card);border:1px solid var(--bd);border-inline-start:4px solid var(--c);border-radius:12px;color:var(--tx);text-decoration:none;transition:border-color .2s,transform .2s}
.cd:hover{border-color:var(--c)}
.cd:active{transform:scale(.99)}
.cd:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.tg{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:15px;direction:ltr;background:color-mix(in srgb,var(--c) 14%,var(--card));color:var(--c)}
.tx{flex:1;min-width:0}
.tx b{display:block;font-weight:600;font-size:18px;line-height:1.4}
.tx small{display:block;color:var(--mu);font-size:14px;line-height:1.6}
.tx em{display:block;font-style:normal;color:var(--c);font-size:13px;font-weight:500;margin-top:2px}
.ar{flex:none;color:var(--c);font-size:20px}
.hint{text-align:center;color:var(--mu);font-size:14px;margin:20px 0 0}
footer{margin-top:40px;padding-top:20px;border-top:1px solid var(--bd);text-align:center;color:var(--mu);font-size:14px}
footer bdi{font-weight:600;color:var(--tx)}
@media (prefers-reduced-motion:reduce){.cd{transition:none}}

.in{max-width:560px;margin:0 auto}
.in h2{font-size:18px;font-weight:600;margin:24px 0 10px;line-height:1.4}
.note{background:var(--card);border:1px solid var(--bd);border-inline-start:4px solid var(--c0);border-radius:12px;padding:12px 16px;font-size:14px;color:var(--mu);margin:0 0 8px}
#st{font-weight:500;color:var(--tx)}
.fm{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;display:grid;gap:14px;font-size:15px}
.fm label.f{display:grid;gap:4px;font-weight:500}
.fm input:not([type=radio]){width:100%;min-height:44px;padding:8px 12px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;box-sizing:border-box}
.cl,.sg{display:flex;gap:10px;flex-wrap:wrap;position:relative;margin-top:6px}
.cl input,.sg input{position:absolute;opacity:0;pointer-events:none}
.cl label{width:36px;height:36px;border-radius:50%;background:var(--k);cursor:pointer;border:3px solid transparent}
.cl input:checked+label{border-color:var(--tx)}
.sg label{padding:8px 14px;border:1px solid var(--bd);border-radius:999px;cursor:pointer;min-height:40px;display:flex;align-items:center;font-size:14px;box-sizing:border-box}
.sg input:checked+label{border-color:var(--c0);color:var(--c0);background:color-mix(in srgb,var(--c0) 12%,var(--card))}
.cl input:focus-visible+label,.sg input:focus-visible+label,.ac:focus-visible,.pri:focus-visible,.sec:focus-visible{outline:2px solid var(--c0);outline-offset:2px}
.pri,.sec{all:unset;cursor:pointer;text-align:center;padding:12px;border-radius:8px;font-weight:600;min-height:44px;box-sizing:border-box}
.pri{background:var(--c0);color:var(--card)}
.sec{border:1px solid var(--c0);color:var(--c0)}
.ex{display:grid;gap:10px}
#ms{margin:0;min-height:1.7em;text-align:start;font-size:14px}
.it{display:flex;flex-wrap:wrap;align-items:center;gap:10px 12px;padding:12px;background:var(--card);border:1px solid var(--bd);border-radius:12px;margin-bottom:8px}
.tg.sm{width:40px;height:40px;font-size:13px}
.it .tx b{font-size:16px}
.it .tx small{direction:ltr;text-align:start;word-break:break-all}
.acs{display:flex;gap:6px;width:100%;justify-content:flex-end}
.ac{all:unset;cursor:pointer;padding:8px 14px;border-radius:8px;border:1px solid var(--bd);font-size:14px;min-height:40px;box-sizing:border-box}
.ac.dng{color:var(--c3);border-color:var(--c3)}
</style>
</head>
<body>
<main class="wrap"><div class="in">
<header><h1>لوحة التحكم</h1><p class="sub">إدارة مسارات التعلّم الظاهرة في الصفحة الرئيسية.</p></header>
<p class="note">التعديلات هنا مسودة في متصفحك فقط. لنشرها: نزّل <bdi dir="ltr">tracks.json</bdi> واستبدل به الملف في المستودع. <span id="st"></span></p>
<h2>إضافة ملف تعلّم</h2>
<div class="fm">
<label class="f">اسم المسار<input id="nm" maxlength="40" autocomplete="off"></label>
<label class="f">وصف قصير<input id="ds" maxlength="90" autocomplete="off"></label>
<label class="f">اسم الملف في المستودع أو رابط خارجي<input id="hf" dir="ltr" placeholder="my-path.html  أو  https://" autocomplete="off"></label>
<div>اللون<div class="cl" role="radiogroup" aria-label="اللون"><input type="radio" name="k" id="k0" value="c0" checked><label for="k0" style="--k:var(--c0)" aria-label="أزرق"></label><input type="radio" name="k" id="k1" value="c1"><label for="k1" style="--k:var(--c1)" aria-label="أخضر"></label><input type="radio" name="k" id="k2" value="c2"><label for="k2" style="--k:var(--c2)" aria-label="بنفسجي"></label><input type="radio" name="k" id="k3" value="c3"><label for="k3" style="--k:var(--c3)" aria-label="مرجاني"></label></div></div>
<button class="pri" id="add">إضافة إلى المسودة</button>
<p class="sub" id="ms" role="status"></p>
</div>
<h2>الملفات الحالية</h2>
<div id="dl"></div>
<h2>النشر</h2>
<div class="ex"><button class="pri" id="dlj">تنزيل tracks.json</button><button class="sec" id="cp">نسخ المحتوى</button><button class="sec" id="rs">استعادة من المستودع</button></div>
</div></main>
<script>
const FB=[{"id": "fe", "t": "Front End", "d": "بناء واجهات المواقع: HTML وCSS وJavaScript وReact", "tag": "FE", "c": "c0", "m": "7 مراحل · امتحان لكل مرحلة", "href": "frontend-roadmap.html"}, {"id": "be", "t": "Back End", "d": "الخوادم وقواعد البيانات وواجهات API مع Node.js", "tag": "BE", "c": "c1", "m": "7 مراحل · امتحان لكل مرحلة", "href": "backend-roadmap.html"}, {"id": "mb", "t": "تطوير الموبايل", "d": "تطبيقات أندرويد وiOS بـ React Native وExpo", "tag": "MB", "c": "c2", "m": "7 مراحل · امتحان لكل مرحلة", "href": "mobile-roadmap.html"}, {"id": "ai", "t": "الذكاء الاصطناعي", "d": "تعلّم الآلة والتعلّم العميق وتطبيقات LLM بـ Python", "tag": "AI", "c": "c3", "m": "7 مراحل · امتحان لكل مرحلة", "href": "ai-roadmap.html"}];
const $=i=>document.getElementById(i),K="cntic-admin-v1";
const OK=h=>/^https?:\/\//i.test(h)||/^[A-Za-z0-9_\-]+(?:\/[A-Za-z0-9_\-]+)*\.html?$/.test(h);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const mk=t=>/^[A-Za-z]/.test(t)?t.slice(0,2).toUpperCase():Array.from(t)[0];
let T=null,REPO=null;
try{const r=localStorage.getItem(K);if(r)T=JSON.parse(r)}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(T))}catch(e){}};
const msg=t=>{$("ms").textContent=t};
const getRepo=()=>fetch("tracks.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw 0;return r.json()}).catch(()=>JSON.parse(JSON.stringify(FB)));
function draw(){
$("st").textContent=JSON.stringify(T)===JSON.stringify(REPO)?"مطابق للمستودع الحالي.":"توجد تغييرات غير منشورة. نزّل tracks.json وارفعه إلى GitHub.";
$("dl").innerHTML=T.length?T.map((x,i)=>'<div class="it"><span class="tg sm" style="--c:var(--'+esc(x.c)+')">'+esc(x.tag)+'</span><span class="tx"><b>'+esc(x.t)+'</b><small>'+esc(x.href)+'</small></span><span class="acs"><button class="ac" data-a="up" data-i="'+i+'" aria-label="تحريك للأعلى"'+(i?"":" disabled")+'>↑</button><button class="ac" data-a="dn" data-i="'+i+'" aria-label="تحريك للأسفل"'+(i<T.length-1?"":" disabled")+'>↓</button><button class="ac dng" data-a="rm" data-i="'+i+'">حذف</button></span></div>').join(""):'<p class="sub">لا توجد ملفات.</p>';
}
$("dl").onclick=e=>{
const b=e.target.closest("button");if(!b||b.disabled)return;const i=+b.dataset.i,a=b.dataset.a;
if(a=="rm"){
if(!b.dataset.ok){b.dataset.ok=1;b.textContent="تأكيد الحذف";setTimeout(()=>{if(b.isConnected){delete b.dataset.ok;b.textContent="حذف"}},3000);return}
T.splice(i,1);
}else{const j=a=="up"?i-1:i+1;[T[i],T[j]]=[T[j],T[i]]}
save();draw();
};
$("add").onclick=()=>{
const t=$("nm").value.trim(),h=$("hf").value.trim();
if(!t){msg("اكتب اسم المسار.");return}
if(!OK(h)){msg("اكتب اسم ملف مثل my-path.html أو رابطًا يبدأ بـ https://");return}
const ex=/^https?:/i.test(h);
T.push({id:"u"+Date.now().toString(36),t:t,d:$("ds").value.trim()||"ملف تعلّم مضاف",tag:mk(t),c:document.querySelector("input[name=k]:checked").value,m:ex?"رابط خارجي":"ملف تعلّم",href:h});
save();["nm","ds","hf"].forEach(i=>$(i).value="");draw();msg("تمت إضافة «"+t+"» إلى المسودة.");
};
$("dlj").onclick=()=>{
const b=new Blob([JSON.stringify(T,null,2)+"\n"],{type:"application/json"}),a=document.createElement("a");
a.href=URL.createObjectURL(b);a.download="tracks.json";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};
$("cp").onclick=()=>{navigator.clipboard.writeText(JSON.stringify(T,null,2)).then(()=>msg("نُسخ المحتوى."),()=>msg("تعذّر النسخ، استخدم زر التنزيل."))};
$("rs").onclick=()=>{
if(!$("rs").dataset.ok){$("rs").dataset.ok=1;$("rs").textContent="تأكيد: تجاهل مسودتي";setTimeout(()=>{delete $("rs").dataset.ok;$("rs").textContent="استعادة من المستودع"},3000);return}
delete $("rs").dataset.ok;$("rs").textContent="استعادة من المستودع";
getRepo().then(r=>{REPO=r;T=JSON.parse(JSON.stringify(r));save();draw();msg("استُعيدت نسخة المستودع.")});
};
getRepo().then(r=>{REPO=r;if(!T)T=JSON.parse(JSON.stringify(r));draw()});
</script>
</body>
</html>
