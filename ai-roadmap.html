<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>خارطة طريق الذكاء الاصطناعي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#5d6670;--bd:#dde1e6;--ok:#1a7f4b;--no:#b3261e;--c1:#0f6e56;--c2:#534ab7;--c3:#993c1d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161a;--card:#1d2026;--tx:#eceef1;--mu:#9aa3ad;--bd:#2d323a;--ok:#4cc38a;--no:#f2877f;--c1:#3fbf97;--c2:#9a93f0;--c3:#ee8f6d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14161a;--card:#1d2026;--tx:#eceef1;--mu:#9aa3ad;--bd:#2d323a;--ok:#4cc38a;--no:#f2877f;--c1:#3fbf97;--c2:#9a93f0;--c3:#ee8f6d;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.7 "IBM Plex Sans Arabic",system-ui,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:24px;font-weight:600;margin:0 0 4px;line-height:1.4}
.sub{color:var(--mu);margin:0 0 16px;font-size:15px}
.pg{height:8px;background:var(--bd);border-radius:4px;overflow:hidden}
#pbar{height:100%;width:0;background:var(--c1);transition:width .4s}
#ptxt{font-size:14px;color:var(--mu);margin:6px 0 24px}
.st{position:relative;padding-inline-start:46px;padding-bottom:14px}
.st::before{content:"";position:absolute;inset-inline-start:15px;top:32px;bottom:-2px;width:2px;background:var(--bd)}
.st:last-of-type::before{display:none}
.st.dn::before{background:var(--c)}
.hd{all:unset;box-sizing:border-box;display:flex;gap:12px;align-items:center;width:100%;cursor:pointer;min-height:44px}
.hd:focus-visible,.op:focus-visible,.act:focus-visible{outline:2px solid var(--c,var(--c1));outline-offset:2px}
.hd[disabled]{cursor:default}
.nd{position:absolute;inset-inline-start:0;top:6px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:15px;background:var(--card);border:2px solid var(--c);color:var(--c)}
.dn .nd{background:var(--c);color:var(--card)}
.lk .nd{border-color:var(--bd);color:var(--mu)}
.hd b{display:block;font-weight:600;font-size:17px;line-height:1.4}
.hd small{display:block;color:var(--mu);font-size:13px;line-height:1.5}
.lk .hd b{color:var(--mu)}
.bd{margin-top:8px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px}
.tp{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.tp span{font-size:13px;padding:2px 12px;border-radius:999px;background:color-mix(in srgb,var(--c) 12%,var(--card));color:var(--c);font-weight:500}
h3{font-size:16px;font-weight:600;margin:0 0 8px}
.q{margin:0 0 16px}
.q p{margin:0 0 8px;font-weight:500;line-height:1.6}
.op{all:unset;box-sizing:border-box;display:block;width:100%;margin:0 0 6px;padding:10px 12px;border:1px solid var(--bd);border-radius:8px;cursor:pointer;font-size:15px;line-height:1.5;direction:ltr;text-align:right;unicode-bidi:plaintext}
.op.sel{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,var(--card))}
.op.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--card))}
.op.bad{border-color:var(--no);background:color-mix(in srgb,var(--no) 14%,var(--card))}
.op[disabled]{cursor:default}
.act{all:unset;box-sizing:border-box;display:block;width:100%;text-align:center;padding:12px;border-radius:8px;background:var(--c);color:var(--card);font-weight:600;cursor:pointer;min-height:44px}
.act[disabled]{opacity:.4;cursor:default}
.res{margin:0 0 12px;font-weight:500}
.res.ok{color:var(--ok)}.res.bad{color:var(--no)}
#rs{all:unset;display:block;margin:20px auto 0;font-size:14px;color:var(--mu);cursor:pointer;padding:10px;text-decoration:underline}
h2{font-size:18px;font-weight:600;margin:28px 0 12px;line-height:1.4}
.row{display:flex;align-items:center}
.stg{all:unset;box-sizing:border-box;flex:0 0 122px;padding:10px 8px;border-radius:12px;border:2px solid var(--c);background:color-mix(in srgb,var(--c) 10%,var(--card));text-align:center;cursor:pointer;color:var(--tx)}
.stg.dn{background:color-mix(in srgb,var(--c) 22%,var(--card))}
.stg b{display:block;font-weight:600;font-size:15px;line-height:1.4}
.stg small{display:block;color:var(--mu);font-size:12px}
.stg:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.cn{flex:0 0 18px;height:2px;background:var(--c)}
.br{list-style:none;margin:0;padding:4px 0;flex:1;border-inline-start:2px solid var(--c)}
.br li{position:relative;padding:3px 0;padding-inline-start:16px;font-size:14px;line-height:1.5}
.br li::before{content:"";position:absolute;inset-inline-start:0;top:50%;width:10px;border-top:2px solid var(--c)}
.sp{width:2px;height:18px;background:var(--bd);margin-inline-start:60px}
.tg{all:unset;box-sizing:border-box;cursor:pointer;font-size:13px;font-weight:500;color:var(--c);padding:4px 12px;border:1px solid var(--c);border-radius:999px;min-height:32px;display:inline-block;line-height:1.6}
.tg:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.rl{margin:8px 0 0;padding:4px 12px;border-inline-start:2px solid var(--c);background:var(--card);border-radius:8px}
.ri{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}
.ri:last-child{border-bottom:0}
.ri a{color:var(--tx);font-size:14px;line-height:1.5;text-decoration:underline;unicode-bidi:plaintext}
.bg{flex:none;font-size:12px;font-weight:500;padding:2px 10px;border-radius:999px}
.bg.y{background:color-mix(in srgb,var(--ok) 16%,var(--card));color:var(--ok)}
.bg.n{background:var(--bg);color:var(--mu);border:1px solid var(--bd)}
.nt{font-size:13px;color:var(--mu);margin:12px 0 0}
@media (prefers-reduced-motion:reduce){#pbar{transition:none}}
</style>
</head>
<body>
<main class="wrap">
<h1>خارطة طريق الذكاء الاصطناعي</h1>
<p class="sub">اضغط على مرحلة للانتقال إلى امتحانها، أو على «المصادر المجانية» لعرض أماكن التعلم.</p>
<div id="map"></div>
<p class="nt">كل المصادر مجانية. شروط الشهادات قد تتغير، فتحقق من الموقع قبل البدء.</p>
<h2>امتحانات المراحل</h2>
<p class="sub">اجتز كل امتحان بـ 3 إجابات صحيحة من 4 لتفتح المرحلة التالية.</p>
<div class="pg"><div id="pbar"></div></div>
<p id="ptxt"></p>
<div id="root"></div>
<button id="rs">إعادة ضبط التقدم</button>
</main>
<script>
const S=[
{t:"Python والرياضيات",d:"6–8 أسابيع",c:"var(--c1)",tp:["أساسيات Python","NumPy وPandas","الجبر الخطي","الاحتمالات والإحصاء","Git وGitHub"],q:[
["أي مكتبة تُستخدم للمصفوفات والعمليات العددية في Python؟",["Flask","NumPy","Django","Pygame"],1],
["ما ناتج ضرب مصفوفة 2×3 في مصفوفة 3×4؟",["غير ممكن","مصفوفة 3×3","مصفوفة 2×4","مصفوفة 2×3"],2],
["ما المتوسط الحسابي للقيم 2 و4 و6؟",["12","5","3","4"],3],
["أي مكتبة مناسبة للتعامل مع الجداول والبيانات؟",["Pandas","Pillow","Tkinter","Requests"],0]]},
{t:"تعلّم الآلة",d:"6–8 أسابيع",c:"var(--c1)",tp:["الانحدار والتصنيف","scikit-learn","تقسيم البيانات والتحقق","مقاييس التقييم","الإفراط في التعلّم"],q:[
["ما الفرق بين التصنيف والانحدار؟",["التصنيف يتنبأ بفئة والانحدار بقيمة رقمية","لا فرق بينهما","التصنيف للصور فقط","الانحدار للنصوص فقط"],0],
["ما الإفراط في التعلّم (Overfitting)؟",["أداء ضعيف على التدريب والاختبار","أداء ممتاز على التدريب وضعيف على بيانات جديدة","نموذج بلا بيانات","نموذج سريع جدًا"],1],
["لماذا نقسّم البيانات إلى تدريب واختبار؟",["لتقليل حجم الملف","لتسريع الحاسوب","لقياس أداء النموذج على بيانات لم يرها","لتغيير الأعمدة"],2],
["أي مكتبة توفر خوارزميات تعلّم الآلة الكلاسيكية؟",["Matplotlib","Pillow","Requests","scikit-learn"],3]]},
{t:"التعلّم العميق",d:"6–8 أسابيع",c:"var(--c1)",tp:["الشبكات العصبية","PyTorch","الشبكات الالتفافية CNN","التحسين وGradient Descent","التنظيم (Regularization)"],q:[
["ما هدف خوارزمية Gradient Descent؟",["تقليل دالة الخسارة بتعديل الأوزان","حذف الأعمدة","ضغط الصور","زيادة حجم البيانات"],0],
["أي نوع شبكات يناسب معالجة الصور غالبًا؟",["Regex","الشبكات الالتفافية (CNN)","SQL","Git"],1],
["ما وظيفة دالة التنشيط في الشبكة العصبية؟",["حفظ الملفات","تسريع الإنترنت","إضافة لاخطية تمكّن الشبكة من تعلّم أنماط معقدة","تلوين النتائج"],2],
["ما الـ Epoch؟",["نوع من الطبقات","اسم مكتبة","دالة تنشيط","مرور كامل واحد على بيانات التدريب"],3]]},
{t:"اللغة والـ Transformers",d:"4–6 أسابيع",c:"var(--c2)",tp:["التمثيلات Embeddings","Attention وTransformers","Hugging Face","Fine-tuning"],q:[
["ما الـ Embedding؟",["تمثيل رقمي (متجه) يحمل معنى النص","ضغط ملف نصي","نوع خط","لغة برمجة"],0],
["ما الآلية الأساسية في معمارية Transformer؟",["Regex","Attention","Cron","Hashing"],1],
["ما منصة Hugging Face؟",["محرر نصوص","نظام تشغيل","مستودع للنماذج والبيانات والمكتبات","لعبة"],2],
["ما الـ Fine-tuning؟",["حذف النموذج","تسريع الشبكة","ترجمة الكود","تدريب إضافي لنموذج جاهز على بيانات مخصصة"],3]]},
{t:"تطبيقات LLM",d:"4–6 أسابيع",c:"var(--c2)",tp:["هندسة الأوامر Prompting","استخدام API النماذج","RAG وقواعد المتجهات","الوكلاء Agents","تقييم الإجابات"],q:[
["ما الـ RAG؟",["جلب معلومات ذات صلة وإدخالها في الطلب قبل توليد الإجابة","ضغط النموذج","تدريب من الصفر","نوع قاعدة SQL"],0],
["لماذا تُستخدم قاعدة المتجهات (Vector DB)؟",["لحفظ الصور فقط","للبحث بالتشابه الدلالي بين التمثيلات","لتشغيل الخوادم","لكتابة الاختبارات"],1],
["ما أفضل وسيلة لتقليل الهلوسة (معلومات خاطئة) في تطبيق LLM؟",["رفع حرارة التوليد","حذف التعليمات","ربط الإجابة بمصادر موثوقة وتقييمها","تقصير الأسئلة فقط"],2],
["ما الوكيل (Agent) في تطبيقات LLM؟",["مستخدم مسجّل","ملف إعدادات","شبكة اجتماعية","نموذج يستخدم أدوات ويتخذ خطوات لتحقيق هدف"],3]]},
{t:"MLOps والنشر",d:"4–5 أسابيع",c:"var(--c3)",tp:["FastAPI","Docker","تتبع التجارب MLflow","المراقبة وData Drift"],q:[
["ما إطار Python الشائع لتقديم النماذج عبر API؟",["FastAPI","Pygame","Tkinter","Pillow"],0],
["لماذا نستخدم Docker مع النماذج؟",["لتجميل النتائج","لتدريب أسرع دائمًا","لتوحيد بيئة التشغيل بين الأجهزة","لحذف البيانات"],2],
["ما فائدة تتبع التجارب (مثل MLflow)؟",["تصميم الواجهات","تسجيل المعاملات والنتائج لمقارنة النماذج","كتابة الأغاني","تشفير البريد"],1],
["ما انحراف البيانات (Data Drift)؟",["حذف الملفات","تسريع التدريب","تغيّر لون الواجهة","تغيّر توزيع بيانات الإنتاج عن بيانات التدريب"],3]]},
{t:"التخصص والاحتراف",d:"مستمرة",c:"var(--c3)",tp:["الرؤية الحاسوبية أو NLP","قراءة الأوراق البحثية","مسابقات Kaggle","معرض أعمال ومقابلات"],q:[
["أين تجد مسابقات ومشاريع ممارسة لتعلّم الآلة؟",["Canva","Kaggle","Spotify","Tinder"],1],
["ما فائدة قراءة الأوراق البحثية؟",["لا فائدة","لتغيير الخط","لحذف الأخطاء","متابعة أحدث الأفكار وفهم أساس التقنيات"],3],
["ما الذي يقوّي معرض أعمال مطوّر الذكاء الاصطناعي؟",["نسخ دروس","صور فقط","مشاريع كاملة تشرح البيانات والتقييم والنتائج","وعود"],2],
["ما مقياس مناسب لتصنيف غير متوازن بدل Accuracy وحدها؟",["F1 أو Precision وRecall","حجم الملف","سرعة الإنترنت","عدد الأسطر"],0]]}
];
const R=[
[["freeCodeCamp: Scientific Computing with Python","https://www.freecodecamp.org/learn",1],["Kaggle Learn: Python وPandas","https://www.kaggle.com/learn",1],["3Blue1Brown: Linear Algebra","https://www.3blue1brown.com/topics/linear-algebra",0],["Khan Academy: Statistics and Probability","https://www.khanacademy.org/math/statistics-probability",0]],
[["Kaggle Learn: Intro to Machine Learning","https://www.kaggle.com/learn/intro-to-machine-learning",1],["freeCodeCamp: Machine Learning with Python","https://www.freecodecamp.org/learn",1],["scikit-learn Tutorials","https://scikit-learn.org/stable/tutorial/index.html",0]],
[["Kaggle Learn: Intro to Deep Learning","https://www.kaggle.com/learn/intro-to-deep-learning",1],["fast.ai: Practical Deep Learning","https://course.fast.ai",0],["PyTorch Tutorials","https://pytorch.org/tutorials/",0],["Karpathy: Zero to Hero","https://karpathy.ai/zero-to-hero.html",0]],
[["Hugging Face: LLM Course","https://huggingface.co/learn/llm-course",0],["The Illustrated Transformer","https://jalammar.github.io/illustrated-transformer/",0],["Transformers Docs","https://huggingface.co/docs/transformers",0]],
[["Hugging Face: Agents Course","https://huggingface.co/learn/agents-course",1],["Anthropic: Prompt Engineering","https://docs.claude.com/en/docs/build-with-claude/prompt-engineering/overview",0],["DeepLearning.AI Short Courses (الشهادة مدفوعة)","https://www.deeplearning.ai/short-courses/",0]],
[["FastAPI Tutorial","https://fastapi.tiangolo.com/tutorial/",0],["Docker: Get started","https://docs.docker.com/get-started/",0],["MLflow Docs","https://mlflow.org/docs/latest/",0]],
[["Kaggle Competitions","https://www.kaggle.com/competitions",0],["Hugging Face Daily Papers","https://huggingface.co/papers",0],["arXiv","https://arxiv.org",0]]
];
const K="ai-roadmap-v1";
let st={p:{}},ans={},chk={},rt={},ro={},open=0,rc=false;
try{const r=localStorage.getItem(K);if(r)st=JSON.parse(r)}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(st))}catch(e){}};
const done=i=>st.p[i]!==undefined,unl=i=>i==0||done(i-1);
const score=i=>S[i].q.reduce((n,x,k)=>n+((ans[i]||{})[k]===x[2]?1:0),0);
const mapEl=document.getElementById("map"),root=document.getElementById("root"),pbar=document.getElementById("pbar"),ptxt=document.getElementById("ptxt"),rs=document.getElementById("rs");
function render(){
const n=S.filter((_,i)=>done(i)).length;
pbar.style.width=n/S.length*100+"%";
ptxt.textContent=n==S.length?"أنهيت الخارطة كاملة. مبارك!":"اجتزت "+n+" من "+S.length+" مراحل";
mapEl.innerHTML=S.map((s,i)=>'<div class="row" style="--c:'+s.c+'"><button class="stg'+(done(i)?" dn":"")+'" data-g="'+i+'"><b>'+(done(i)?"✓ ":"")+(i+1)+". "+s.t+"</b><small>"+s.d+'</small></button><i class="cn"></i><ul class="br">'+s.tp.map(x=>"<li>"+x+"</li>").join("")+'<li><button class="tg" data-s="'+i+'" aria-expanded="'+!!ro[i]+'">المصادر المجانية '+(ro[i]?"▴":"▾")+"</button></li></ul></div>"+(ro[i]?'<div class="rl" style="--c:'+s.c+'">'+R[i].map(r=>'<div class="ri"><a href="'+r[1]+'" target="_blank" rel="noopener">'+r[0]+'</a><span class="bg '+(r[2]?"y":"n")+'">'+(r[2]?"يوجد شهادة":"بدون شهادة")+"</span></div>").join("")+"</div>":"")+(i<S.length-1?'<div class="sp"></div>':"")).join("");
root.innerHTML=S.map((s,i)=>{
const lk=!unl(i),dn=done(i),o=open===i&&!lk;
let b="";
if(o){
b="<h3>امتحان المرحلة</h3>";
if(dn&&!chk[i]&&!rt[i]){
b+='<p class="res ok">اجتزت هذا الامتحان بنتيجة '+st.p[i]+' من 4.</p><button class="act" data-r="'+i+'">أعد الامتحان</button>';
}else{
b+=s.q.map((x,k)=>'<div class="q"><p>'+(k+1)+". "+x[0]+"</p>"+x[1].map((t,j)=>{
let c="op";const a=(ans[i]||{})[k];
if(chk[i]){if(j===x[2])c+=" ok";else if(a===j)c+=" bad"}else if(a===j)c+=" sel";
return '<button class="'+c+'" data-i="'+i+'" data-q="'+k+'" data-o="'+j+'"'+(chk[i]?" disabled":"")+">"+t+"</button>"}).join("")+"</div>").join("");
if(!chk[i]){
b+='<button class="act" data-c="'+i+'"'+(Object.keys(ans[i]||{}).length<4?" disabled":"")+">تحقق من الإجابات</button>";
}else{
const sc=score(i);
b+=sc>=3?'<p class="res ok">أحسنت: '+sc+' من 4. فُتحت المرحلة التالية.</p>'+(i<S.length-1?'<button class="act" data-n="'+i+'">تابع إلى المرحلة التالية</button>':"")
:'<p class="res bad">نتيجتك '+sc+' من 4، وتحتاج 3 على الأقل. راجع المواضيع وأعد المحاولة.</p><button class="act" data-r="'+i+'">أعد المحاولة</button>';
}}}
return '<section id="st'+i+'" class="st'+(lk?" lk":"")+(dn?" dn":"")+'" style="--c:'+s.c+'"><button class="hd" data-t="'+i+'"'+(lk?" disabled":"")+'><span class="nd">'+(dn?"✓":i+1)+"</span><span><b>"+s.t+"</b><small>"+(lk?"تُفتح بعد اجتياز امتحان المرحلة السابقة":s.d+(dn?" · اجتزتها":""))+"</small></span></button>"+(o?'<div class="bd">'+b+"</div>":"")+"</section>"}).join("");
}
root.onclick=e=>{
const b=e.target.closest("button");if(!b||b.disabled)return;const d=b.dataset;
if(d.t!==undefined)open=open===+d.t?-1:+d.t;
else if(d.o!==undefined){(ans[d.i]=ans[d.i]||{})[d.q]=+d.o}
else if(d.c!==undefined){const i=+d.c,sc=score(i);chk[i]=true;if(sc>=3){st.p[i]=sc;save()}}
else if(d.r!==undefined){const i=+d.r;ans[i]={};chk[i]=false;rt[i]=true}
else if(d.n!==undefined){const i=+d.n;chk[i]=false;rt[i]=false;open=i+1}
render();
};
mapEl.onclick=e=>{
